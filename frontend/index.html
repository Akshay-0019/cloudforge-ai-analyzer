<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Data Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #121212; color: #e0e0e0; }
        h2 { color: #ffffff; font-weight: 600; }
        #drop-zone { border: 2px dashed #555; background-color: #1e1e1e; padding: 50px; text-align: center; cursor: pointer; border-radius: 12px; margin-bottom: 20px; transition: all 0.3s ease; }
        #drop-zone:hover { background-color: #2a2a2a; border-color: #4da6ff; }
        #loading { display: none; font-weight: bold; color: #4da6ff; margin-bottom: 20px; text-align: center; }
        .hidden { display: none; }
        .card { border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 20px; background: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: #ffffff; }
        p { line-height: 1.6; color: #cccccc; }
        /* Make the chart canvas readable in dark mode */
        canvas { background-color: #ffffff; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>
    <h2>Cloudforge Analysis Engine</h2>
    <div id="drop-zone">Drag and drop a CSV file here, or click to select</div>
    <input type="file" id="file-input" class="hidden" accept=".csv">
    
    <div id="loading">Analyzing dataset with Claude AI... please wait.</div>
    
    <div id="result" class="hidden">
        <div class="card">
            <h3>AI Explanation</h3>
            <p id="ai-explanation"></p>
        </div>
        <div class="card" style="padding-bottom: 10px;">
            <canvas id="myChart"></canvas>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
